<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprendizaje Supervisado</title>
  <style>
    /* RESET & FUENTES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }

    /* ENCABEZADO */
    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }

    header p {
      font-size: 1rem;
      color: #64748b;
    }

    /* GRID DE TARJETAS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    /* TARJETAS (LINKS) */
    .card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      text-decoration: none;
      color: #334155;
      transition: all 0.2s ease-in-out;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #3b82f6;
      box-shadow: 0 12px 20px -5px rgba(59, 130, 246, 0.15);
      background-color: #f8fafc;
    }

    /* ÍCONOS */
    .icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background-color: #eff6ff;
      color: #2563eb;
      border-radius: 10px;
      flex-shrink: 0;
      transition: background-color 0.2s ease;
    }

    .card:hover .icon-box {
      background-color: #2563eb;
      color: #ffffff;
    }

    .icon-box svg {
      width: 24px;
      height: 24px;
    }

    /* TEXTO DE TARJETA */
    .card-content {
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 0.25rem;
    }

    .card:hover .card-title {
      color: #2563eb;
    }

    .card-subtitle {
      font-size: 0.825rem;
      color: #64748b;
    }

    /* FLECHA INDICADORA */
    .arrow {
      margin-left: auto;
      color: #cbd5e1;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .card:hover .arrow {
      color: #2563eb;
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Dashboard de Aprendizaje Supervisado</h1>
      <p>Selecciona un módulo o algoritmo para explorar los modelos:</p>
    </header>

    <div class="grid">
      <!-- Regresión -->
      <a href="./regresion/" class="card">
        <div class="icon-box">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v18h18M7 14l4-4 4 4 5-5"></path></svg>
        </div>
        <div class="card-content">
          <span class="card-title">Regresión Lineal</span>
          <span class="card-subtitle">Simple y múltiple</span>
        </div>
        <svg class="arrow" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
      </a>

      <!-- Árbol de decisión -->
      <a href="./arbol-decision/" class="card">
        <div class="icon-box">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v6m0 0l-4 4m4-4l4 4m-8 4v4m8-4v4"></path></svg>
        </div>
        <div class="card-content">
          <span class="card-title">Árbol de Decisión</span>
          <span class="card-subtitle">Clasificación y regresión</span>
        </div>
        <svg class="arrow" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
      </a>

      <!-- Random Forest -->
      <a href="./random-forest/" class="card">
        <div class="icon-box">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 20h16M12 4L7 12h10l-5-8zM6 12l-3 5h18l-3-5"></path></svg>
        </div>
        <div class="card-content">
          <span class="card-title">Random Forest</span>
          <span class="card-subtitle">Ensemble de árboles</span>
        </div>
        <svg class="arrow" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
      </a>

      <!-- SVM -->
      <a href="./svm/" class="card">
        <div class="icon-box">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM9 9l6 6M15 9l-6 6"></path></svg>
        </div>
        <div class="card-content">
          <span class="card-title">SVM</span>
          <span class="card-subtitle">Máquinas de soporte vectorial</span>
        </div>
        <svg class="arrow" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
    </div>
  </div>

</body>
</html>
